# Keeps the Supabase Free plan project from being auto-paused for inactivity.
# Calls a trivial RPC once a day so the project sees real database activity.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC (12:17 JST)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query database via keepalive RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body -sS --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
